[project]
name = "llm-agent-collusion"
version = "0.2.0"
description = "Evaluating LLM Agent Collusion in Double Auctions (Agrawal et al. 2025). Hackathon edition."
readme = "README.md"
requires-python = ">=3.12"
# Core: run simulations through OpenRouter, compute metrics, make plots. CPU only.
dependencies = [
    "poseidon-compute",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.6",
    "openai>=1.60",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "backoff>=2.2",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# analysis.py / judge_reliability.py (bootstrap CIs, inter-rater reliability)
analysis = ["scipy>=1.11", "seaborn>=0.13", "krippendorff>=0.8", "reliabilipy>=0.0.36"]
# opt-in experiment tracking (--wandb)
wandb = ["wandb>=0.19"]
# original direct-SDK clients (LLM_PROVIDER=anthropic|google); not needed with OpenRouter
providers = ["anthropic>=0.45", "google-cloud-aiplatform>=1.71"]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.continuous_double_auction" = ["prompt_templates/*.jinja2"]
"src.collusion_detection" = ["prompts/v1/*.txt", "prompts/v2/*.txt", "prompts/v3/*.txt"]

[tool.ruff]
line-length = 120

[tool.uv.sources]
poseidon-compute = { path = "../util", editable = true }
